---
# Minimal DeerFlow config for user pods.
# Models and API keys are injected via environment variables at pod creation time.
# The hub passes the host's config.yaml content as a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: deerflow-user-config
  namespace: deerflow
data:
  config.yaml: |
    config_version: 9
    log_level: info
    token_usage:
      enabled: false
    models: []
    tool_groups:
    - name: web
    - name: file:read
    - name: file:write
    - name: bash
    sandbox:
      use: deerflow.sandbox.local:LocalSandboxProvider
      allow_host_bash: true
    tools:
    - name: web_search
      group: web
      use: deerflow.community.ddg_search.tools:web_search_tool
      max_results: 5
    - name: web_fetch
      group: web
      use: deerflow.community.jina_ai.tools:web_fetch_tool
      timeout: 10
    - name: ls
      group: file:read
      use: deerflow.sandbox.tools:ls_tool
    - name: read_file
      group: file:read
      use: deerflow.sandbox.tools:read_file_tool
    - name: write_file
      group: file:write
      use: deerflow.sandbox.tools:write_file_tool
    - name: str_replace
      group: file:write
      use: deerflow.sandbox.tools:str_replace_tool
    - name: bash
      group: bash
      use: deerflow.sandbox.tools:bash_tool