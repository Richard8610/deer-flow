---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub
  namespace: deerflow

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-role
  namespace: deerflow
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-rolebinding
  namespace: deerflow
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: deerflow
roleRef:
  kind: Role
  name: hub-role
  apiGroup: rbac.authorization.k8s.io